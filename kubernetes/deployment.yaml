apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-management-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: task-management-api

  template:
    metadata:
      labels:
        app: task-management-api

    spec:
      containers:
        - name: task-management-api
          image: task-management-api:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
